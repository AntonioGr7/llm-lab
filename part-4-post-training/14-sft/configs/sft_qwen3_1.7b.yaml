# Module 14 — SFT — the canonical demo config.
#
# Full fine-tune Qwen3-1.7B-Base on HuggingFaceH4/no_robots (10k hand-curated
# instruction examples) into an instruction-following model.
#
# Hardware:  single A100-80GB (activation checkpointing keeps it at ~39 GB).
# Wallclock: ~1.5-2 hours.  Cost: ~$3-5 on RunPod / Lambda.
# Effective batch = bs(4) * grad_accum(16) * world(1) = 64.  ÷ world on >1 GPU
# (e.g. --training.grad_accum=2 on an 8-GPU node keeps eff_batch=64).
#
# Everything here is explained in the README: the LR (§6), the AC default and
# memory math (§4), the loss mask the data pipeline applies (§3).

model:
  name: Qwen/Qwen3-1.7B-Base
  max_seq: 2048

data:
  source: HuggingFaceH4/no_robots
  split: train
  seq_len: 2048
  batch_size_per_device: 4
  num_workers: 2
  pin_memory: true
  seed: 0
  chat_template_name: auto   # use the tokenizer's built-in template
  system_prompt: ""          # no_robots prefers no system prompt
  pack: false

optimizer:
  type: adamw
  lr: 1.0e-5                 # ~30x lower than pretraining — see README §6
  betas: [0.9, 0.999]        # 0.999 (not pretraining's 0.95): cleaner SFT grads
  eps: 1.0e-8
  weight_decay: 0.0          # full FT + small dataset — decay costs capability

schedule:
  type: cosine
  warmup_steps: 100          # ~17% of the run; SFT warms up over more of training
  min_lr_ratio: 0.1

training:
  total_steps: 600           # ~3 epochs over 10k examples at eff_batch 64
  grad_accum: 16
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: true   # required to fit 1.7B full-FT on 80GB (README §4)
  log_every: 10
  save_every: 200
  eval_every: 0
  checkpoint_dir: ./results/checkpoints
  keep_last_n_checkpoints: 3
  milestone_every: 0
  # Weights & Biases (rank-0 only). Empty project => disabled.
  wandb_project: ""          # e.g. "llm-lab-sft"
  wandb_entity: ""
  wandb_run_name: ""
  wandb_run_id: ""           # set to a prior run id to RESUME that W&B run
  wandb_tags: []
