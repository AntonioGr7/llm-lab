# Canonical SDFT run — Qwen3-1.7B learns a tool-use schema from 8 demos
# while preserving GSM8K accuracy. Uses REAL function-calling data (Hermes/Glaive).
#
# Before running:
#   # ~30s download + filter; ~50MB cached. Produces ./data/{demos,train,eval}.jsonl.
#   python prepare_tooluse_corpus.py --out=./data
#
# This is the headline "have your cake" demo:
#   - Plain SFT on the 8 demos would (a) push tool-use accuracy up and
#     (b) catastrophically forget GSM8K reasoning (the gradient pushes the
#     model far from itself on a tiny target).
#   - SDFT (this config) uses the same model conditioned on the 8 demos as
#     a self-teacher; trains the student to match that teacher's
#     distribution on FRESH prompts drawn from a 2000-example real-data pool.
#     The student learns tool-use behavior without the gradient destroying
#     prior skills.
#
# Want to scale this up? Two easy levers:
#   --data.max_train=10000  → bigger pool, more diverse coverage (~$15-25)
#   --model.name=Qwen/Qwen3-7B  → SDFT paper-style effect size (~$30-60)
#
# Expected wallclock on a single A100-80GB: ~3-6 hours for 400 steps.
# Cost: ~$6-12 on RunPod / Lambda Labs.

model:
  name: Qwen/Qwen3-1.7B           # SFT'd by Qwen; the student. In SDFT, also the teacher.
  teacher_name: ""                 # "" -> use `name` (SDFT self-teacher).
  max_seq: 8192                    # 8 demos × ~750 chars + completion needs room

data:
  corpus_dir: ./data               # produced by prepare_tooluse_corpus.py
  prompts_per_step: 4
  seq_len: 8192                    # tool defs in-context inflate prompts vs synthetic
  num_workers: 0
  pin_memory: true
  # GSM8K prior-skill eval (matches Module 17's source)
  gsm8k_source: openai/gsm8k
  gsm8k_subset: main
  gsm8k_split: test
  gsm8k_n_eval: 100

distill:
  mode: sdft                       # the main act
  n_demonstrations: 8              # K from the SDFT paper
  kl_direction: forward            # standard imitation default
  temperature: 1.0                 # no logit softening
  top_k_kl: 0                      # full vocab (set 256 if memory-pinched)
  sampling_temperature: 0.9        # teacher's rollout diversity
  top_p: 0.95
  max_new_tokens: 128              # tool calls are short

optimizer:
  type: adamw
  lr: 2.0e-5                       # between SFT (1e-5) and active fine-tuning
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 40
  min_lr_ratio: 0.1

training:
  total_steps: 400                 # ~2 epochs over a 2000-prompt pool at P=4
  grad_accum: 1
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: true
  log_every: 1
  save_every: 100
  eval_every: 100                  # two-axis eval (tool-use + GSM8K) every 100 steps
  eval_n_gsm8k: 50                 # smaller during training; --full at the end
  keep_last_n_checkpoints: 3
  checkpoint_dir: ./results/checkpoints
