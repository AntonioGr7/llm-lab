# Canonical DPO run — full FT of an SFT'd Qwen3-1.7B on the Zephyr preference set.
#
# `model.name` here points at `Qwen/Qwen3-1.7B` — Alibaba's already-SFT'd
# instruct model. The cleanest no-setup path: download an instruct model
# and DPO on top of it. If you ran Module 15 yourself and want to DPO
# YOUR SFT checkpoint instead, set:
#     model.name: /path/to/15-sft/results/checkpoints/step_00000600
# (it must be exported to HF format — see Module 15's export_hf.py).
#
# `ref_name: ""` means "the reference is the same checkpoint as the
# policy, just frozen". This is the textbook DPO setup. Override to
# point at the base model (pre-SFT) if you want a harder KL anchor.
#
# Expected wallclock on a single A100-80GB: ~2-3 hours.
# Cost: ~$4-6 on RunPod / Lambda Labs.

model:
  name: Qwen/Qwen3-1.7B           # an SFT'd model; the policy starts here
  ref_name: ""                     # "" -> use model.name as reference
  max_seq: 1024

data:
  source: HuggingFaceH4/ultrafeedback_binarized
  split: train_prefs
  seq_len: 1024
  batch_size_per_device: 2         # 2× this in the forward (chosen + rejected)
  num_workers: 0
  pin_memory: true

preference:
  loss_type: dpo                   # 'dpo' or 'ipo' (one-line swap)
  beta: 0.1                        # KL strength — Zephyr / Tülu default
  label_smoothing: 0.0             # set 0.1 for cDPO on noisy preference data
  reference_free: false            # never true in real runs

optimizer:
  type: adamw
  lr: 5.0e-7                       # ~20× lower than SFT; see README §6
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 50
  min_lr_ratio: 0.1

training:
  total_steps: 1000                # ~1 epoch over 60k pairs at eff_pairs=32 (bs=2 × accum=16)
  grad_accum: 16                   # eff_pairs = 32 on 1 GPU; ÷ world_size for multi-GPU
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: true   # two models in memory + 1.7B FT — AC is mandatory
  log_every: 10
  save_every: 250
  keep_last_n_checkpoints: 3
  checkpoint_dir: ./results/checkpoints
