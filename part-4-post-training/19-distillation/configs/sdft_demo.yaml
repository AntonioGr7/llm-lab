# Demo SDFT run — Qwen3-0.6B with a tiny tool-use slice. 30 steps, ~10-15 min.
# Goal: exercise the SDFT codepath end-to-end. The reward curve won't move
# much (0.6B is too small + 30 steps is too few); this is for code correctness.
#
# Cost: $0-1 on any GPU.

model:
  name: Qwen/Qwen3-0.6B
  teacher_name: ""                 # SDFT — self
  max_seq: 2048

data:
  corpus_dir: ./data
  prompts_per_step: 2
  seq_len: 2048
  num_workers: 0
  pin_memory: true
  max_train: 64                    # tiny slice
  gsm8k_n_eval: 20                 # very fast prior-skill check

distill:
  mode: sdft
  n_demonstrations: 4              # fewer demos to fit shorter seq_len
  kl_direction: forward
  temperature: 1.0
  top_k_kl: 0
  sampling_temperature: 0.9
  top_p: 0.95
  max_new_tokens: 64

optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 5
  min_lr_ratio: 0.1

training:
  total_steps: 30
  grad_accum: 1
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: true
  log_every: 1
  save_every: 15
  eval_every: 15
  eval_n_gsm8k: 20
  keep_last_n_checkpoints: 2
  checkpoint_dir: ./results/checkpoints_demo
