# Module 16 — LoRA — the $0-1 dev / smoke config.
#
# LoRA-tune a small public base (Qwen3-0.6B-Base) on a 500-example slice.
# Downloads in seconds, runs in minutes on any GPU (or slowly on CPU with
# dtype: fp32), and exercises the whole inject -> train -> merge pipeline.
#
# Swap model.name for your own HF-format base if you have one (e.g. the
# Module 11 export, like the SFT demo). The LoRA code path is identical.

model:
  name: Qwen/Qwen3-0.6B-Base
  max_seq: 1024

data:
  source: HuggingFaceH4/no_robots
  split: train
  seq_len: 1024
  batch_size_per_device: 2
  num_workers: 0
  pin_memory: true
  seed: 0
  chat_template_name: auto
  system_prompt: ""
  pack: false
  max_examples: 500          # cap for a fast smoke; remove for the full set

lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  qlora: false

optimizer:
  type: adamw
  lr: 2.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 10
  min_lr_ratio: 0.1

training:
  total_steps: 60
  grad_accum: 4
  grad_clip: 1.0
  dtype: bf16                # set fp32 on CPU-only smoke tests
  activation_checkpointing: false
  log_every: 5
  save_every: 30
  eval_every: 0
  checkpoint_dir: ./results/checkpoints
  keep_last_n_checkpoints: 2
  milestone_every: 0
  wandb_project: ""
  wandb_entity: ""
  wandb_run_name: ""
  wandb_run_id: ""
  wandb_tags: []
