# Module 16 — QLoRA — 4-bit frozen base + bf16 adapters.
#
# Identical to lora_qwen3_1.7b.yaml except the base is loaded in 4-bit NF4
# (Dettmers et al. 2023). The 1.7B base shrinks from ~3.4 GB (bf16) to ~1 GB,
# so the whole fine-tune fits in ~6 GB — a free-tier Colab T4, or any 8GB card.
#
# Requirements:  pip install bitsandbytes  (CUDA only — no CPU 4-bit kernels).
# Launch:        single GPU only. bitsandbytes does not compose with FSDP, so
#                keep --nproc_per_node=1. For multi-GPU PEFT use the standard
#                (non-quantized) lora config instead.
# Wallclock:     ~45-75 min (4-bit dequant adds a little per-step overhead).
#                Cost: ~$0.50-1.50, or $0 on Colab.
#
# QLoRA trades a little speed and a hair of quality for a big memory cut. At
# 1.7B you rarely need it; the technique earns its keep at 7B-70B where the
# bf16 base no longer fits. We ship it here so you can run it once and feel it.

model:
  name: Qwen/Qwen3-1.7B-Base
  max_seq: 2048

data:
  source: HuggingFaceH4/no_robots
  split: train
  seq_len: 2048
  batch_size_per_device: 4
  num_workers: 0
  pin_memory: true
  seed: 0
  chat_template_name: auto
  system_prompt: ""
  pack: false

lora:
  r: 16                      # a touch higher rank to offset the 4-bit base's noise
  alpha: 32                  # alpha = 2r again
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  qlora: true                # <-- 4-bit NF4 base
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

optimizer:
  type: adamw
  lr: 2.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: cosine
  warmup_steps: 50
  min_lr_ratio: 0.1

training:
  total_steps: 600
  grad_accum: 16
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: false
  log_every: 10
  save_every: 200
  eval_every: 0
  checkpoint_dir: ./results/checkpoints
  keep_last_n_checkpoints: 3
  milestone_every: 0
  wandb_project: ""
  wandb_entity: ""
  wandb_run_name: ""
  wandb_run_id: ""
  wandb_tags: []
