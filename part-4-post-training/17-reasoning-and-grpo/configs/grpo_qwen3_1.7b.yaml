# Canonical GRPO run — Qwen3-1.7B (SFT'd) on GSM8K.
#
# `model.name` points at `Qwen/Qwen3-1.7B` — Alibaba's already-SFT'd instruct
# model. GRPO refines its reasoning capability using rule-based rewards on
# GSM8K math word problems. If you ran Modules 15 (SFT) and 16 (DPO) yourself
# and want to GRPO YOUR checkpoint, set:
#     model.name: /path/to/16-preference-optimization/results/checkpoints/step_00001000
# (exported to HF format — see Module 15's export_hf.py).
#
# `ref_name: ""` means "reference is the same checkpoint as the policy, just
# frozen". This is the textbook GRPO setup — the policy is anchored to where
# it started.
#
# Expected wallclock on a single A100-80GB: ~4-8 hours for 300 steps.
# Cost: ~$8-15 on RunPod / Lambda Labs.

model:
  name: Qwen/Qwen3-1.7B           # an SFT'd model; the policy starts here
  ref_name: ""                     # "" -> use model.name as reference
  max_seq: 2048

data:
  source: openai/gsm8k
  subset: main
  split: train
  seq_len: 1024                    # prompt buffer (left-padded); plenty for GSM8K word problems
  prompts_per_step: 4              # P=4 prompts per RL step
  num_workers: 0
  pin_memory: true

reward:
  w_format: 0.1                    # small bonus for emitting the schema
  w_accuracy: 1.0                  # accuracy dominates — what we actually optimize
  # Default R1 schema: <think>...</think><answer>...</answer>
  # format_pattern: '<think>[\s\S]*?</think>\s*<answer>[\s\S]*?</answer>'

rl:
  group_size: 8                    # G=8 completions per prompt
  temperature: 0.9                 # slightly conservative; raise to 1.0 for more exploration
  top_p: 0.95
  top_k: 0                         # 0 = disabled
  max_new_tokens: 512              # plenty for GSM8K-style CoT
  kl_beta: 0.04                    # DeepSeekMath / R1 default
  clip_ratio: 0.2                  # standard PPO ε
  mu_epochs: 1                     # K=1 (one gradient step per rollout — most stable)
  adv_eps: 1.0e-6

optimizer:
  type: adamw
  lr: 1.0e-6                       # ~2× DPO's; see README §6
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: constant                   # GRPO standard — short runs, no decay
  warmup_steps: 20
  min_lr_ratio: 1.0                # constant => keep peak LR

training:
  total_steps: 300                 # ~30 GSM8K passes at G=8, P=4
  grad_accum: 1                    # rollouts already aggregate the G·P signal
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: true   # two models + rollouts — AC is mandatory
  log_every: 1                     # RL steps are slow; log every one
  save_every: 50
  keep_last_n_checkpoints: 3
  checkpoint_dir: ./results/checkpoints
