# Demo GRPO run — Qwen3-0.6B on a tiny GSM8K slice. ~20 steps for a
# sanity-check end-to-end. NOT for producing a usable reasoner.
#
# Goal: exercise the whole codepath — generate, reward, advantage,
# loss, backward — in 10-15 minutes on any GPU. The reward curve will
# barely move (0.6B is too small + 20 steps is too few + slice is tiny);
# this config is for code-correctness, not learning.
#
# Cost: $0-1 on any GPU; ~10-15 minutes wallclock.

model:
  name: Qwen/Qwen3-0.6B            # already SFT'd by Qwen
  ref_name: ""                     # "" -> use model.name as reference
  max_seq: 1024

data:
  source: openai/gsm8k
  subset: main
  split: train
  seq_len: 512
  prompts_per_step: 2              # small P for the demo
  num_workers: 0
  pin_memory: true
  max_examples: 64                 # tiny slice for the smoke test

reward:
  w_format: 0.1
  w_accuracy: 1.0

rl:
  group_size: 4                    # small G — fewer completions per step
  temperature: 0.9
  top_p: 0.95
  top_k: 0
  max_new_tokens: 256              # smaller budget for the demo
  kl_beta: 0.04
  clip_ratio: 0.2
  mu_epochs: 1
  adv_eps: 1.0e-6

optimizer:
  type: adamw
  lr: 5.0e-6                       # slightly higher than canonical — smaller model
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

schedule:
  type: constant
  warmup_steps: 5
  min_lr_ratio: 1.0

training:
  total_steps: 20
  grad_accum: 1
  grad_clip: 1.0
  dtype: bf16
  activation_checkpointing: true
  log_every: 1
  save_every: 10
  keep_last_n_checkpoints: 2
  checkpoint_dir: ./results/checkpoints_demo
